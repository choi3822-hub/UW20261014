<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nemotron 챗봇</title>
  <style>
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #6b7280;
      --border: #e3e6ea; --accent: #76b900; --accent-text: #ffffff;
      --user: #1f2937; --user-text: #ffffff; --bot: #eef1f4; --error: #c0392b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115; --panel: #171a20; --text: #e6e8eb; --muted: #9aa3ad;
        --border: #262b33; --user: #2f6f00; --user-text: #ffffff; --bot: #1e232b; --error: #ff6b5e;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif;
      display: flex; flex-direction: column;
    }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
    }
    header h1 { font-size: 16px; margin: 0; display: flex; align-items: center; gap: 8px; }
    header h1::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
    header button {
      background: none; border: 1px solid var(--border); color: var(--muted);
      border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer;
    }
    main { flex: 1; overflow-y: auto; padding: 16px; }
    .log { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
    .assistant { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
    .error { align-self: center; color: var(--error); font-size: 14px; }
    .typing::after { content: "▍"; animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .empty { text-align: center; color: var(--muted); margin-top: 20vh; }
    .empty p { margin: 4px 0; }
    form {
      display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border); background: var(--panel);
    }
    .inner { max-width: 760px; margin: 0 auto; width: 100%; display: flex; gap: 8px; }
    textarea {
      flex: 1; resize: none; min-height: 44px; max-height: 160px; padding: 11px 12px;
      border: 1px solid var(--border); border-radius: 12px; background: var(--bg); color: var(--text);
      font: inherit; font-size: 15px; outline: none;
    }
    textarea:focus { border-color: var(--accent); }
    form button {
      border: none; border-radius: 12px; padding: 0 18px; background: var(--accent);
      color: var(--accent-text); font-weight: 600; font-size: 15px; cursor: pointer;
    }
    form button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <header>
    <h1>Nemotron 챗봇</h1>
    <button id="reset" type="button">새 대화</button>
  </header>
  <main id="scroll">
    <div class="log" id="log">
      <div class="empty" id="empty">
        <p><strong>무엇이든 물어보세요</strong></p>
        <p>NVIDIA Nemotron (OpenRouter 무료) 모델로 답변합니다.</p>
      </div>
    </div>
  </main>
  <form id="form">
    <div class="inner">
      <textarea id="input" rows="1" placeholder="메시지를 입력하세요 (Shift+Enter 줄바꿈)" autofocus></textarea>
      <button id="send" type="submit">전송</button>
    </div>
  </form>

  <script>
    const log = document.getElementById("log");
    const scroller = document.getElementById("scroll");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    let history = [];
    let busy = false;

    function add(role, text) {
      document.getElementById("empty")?.remove();
      const el = document.createElement("div");
      el.className = "msg " + role;
      el.textContent = text;
      log.appendChild(el);
      scroller.scrollTop = scroller.scrollHeight;
      return el;
    }

    function autosize() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 160) + "px";
    }

    async function ask(text) {
      busy = true; send.disabled = true;
      history.push({ role: "user", content: text });
      add("user", text);
      const bubble = add("assistant", "");
      bubble.classList.add("typing");
      let answer = "";

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || "요청 실패 (" + res.status + ")");
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const lines = buf.split("\n");
          buf = lines.pop();
          for (const line of lines) {
            if (!line.startsWith("data:")) continue;
            const payload = line.slice(5).trim();
            if (payload === "[DONE]") continue;
            try {
              const chunk = JSON.parse(payload);
              if (chunk.error) throw new Error(chunk.error.message || "스트림 오류");
              const delta = chunk.choices?.[0]?.delta?.content;
              if (delta) {
                answer += delta;
                bubble.textContent = answer;
                scroller.scrollTop = scroller.scrollHeight;
              }
            } catch (e) {
              if (e instanceof SyntaxError) continue;
              throw e;
            }
          }
        }
        if (!answer) throw new Error("모델이 빈 응답을 보냈습니다. 다시 시도해 주세요.");
        history.push({ role: "assistant", content: answer });
      } catch (err) {
        if (!answer) bubble.remove();
        history.pop();
        add("error", "⚠ " + err.message);
      } finally {
        bubble.classList.remove("typing");
        busy = false; send.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || busy) return;
      input.value = ""; autosize();
      ask(text);
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        form.requestSubmit();
      }
    });
    input.addEventListener("input", autosize);
    document.getElementById("reset").addEventListener("click", () => {
      if (busy) return;
      history = [];
      log.innerHTML = '<div class="empty" id="empty"><p><strong>무엇이든 물어보세요</strong></p><p>NVIDIA Nemotron (OpenRouter 무료) 모델로 답변합니다.</p></div>';
    });
  </script>
</body>
</html>
